<!-- apps/frontend/src/app/features/sign-up/sign-up.component.html -->
<div class="auth-page">
  <h1>Create an account</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error">Enter a valid email</p>
    }

    <label>
      Password
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
    </label>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error">Password must be at least 8 characters</p>
    }

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Sign up' }}
    </button>
  </form>

  <p>Already have an account? <a routerLink="/signin">Sign in</a></p>
</div>
